name: Relay APK to Tencent Cloud

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run containing the APK artifact
        required: true
      artifact_name:
        description: Artifact name
        required: true
      relay_host:
        description: Temporary relay server
        required: true

permissions:
  actions: read
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download existing APK artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: relay

      - name: Copy APK to temporary relay
        env:
          RELAY_HOST: ${{ inputs.relay_host }}
          RELAY_SSH_KEY: ${{ secrets.DATECHAT_RELAY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$RELAY_HOST" >> ~/.ssh/known_hosts
          scp relay/datechat-v0.1.0-4522728-huawei-pura70-arm64-v8a.apk \
            "root@$RELAY_HOST:/tmp/datechat-v0.1.0-4522728-huawei-pura70-arm64-v8a.apk"
